name: Grades table release
on:
  push:
    branches: ['claude/grades-table-release-20261102']
    paths: ['scripts/grades-table-release-request.json', 'scripts/release-grades-table.mjs', '.github/workflows/grades-table-release.yml']
permissions:
  contents: read
concurrency:
  group: stepwise-production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mugilives-max/stepwise-kobetsu'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: release-control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8c61c5e891e27d338f0a7eaee3fac90b8db27fed
          path: release-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 71dd5d97d80b727ba4c11c7954f6f4334806d2bf
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: npm ci
        working-directory: release-source
      - run: npm ci
        working-directory: baseline
      - name: Check pinned release
        run: |
          node --check release-control/scripts/release-grades-table.mjs
      - name: Preserve records and perform explicitly requested operation
        env:
          GH_READ_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: node release-control/scripts/release-grades-table.mjs
