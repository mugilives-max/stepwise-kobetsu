name: Employment review (no deployment)
on:
  push:
    branches: ['codex/staff-onboarding-flow-20261017']
    paths: ['cf/v2/**','cf/migrations-v2/**','staff/**','test/**','scripts/check-employment-ui.cjs','.github/workflows/employment-preview.yml']
permissions:
  contents: write
concurrency:
  group: employment-preview
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Regression tests in isolated databases
        run: |
          mkdir -p employment-review-output
          node --test test/v2-*.test.cjs > employment-review-output/regression.txt || { tail -n 120 employment-review-output/regression.txt; exit 1; }
          tail -n 10 employment-review-output/regression.txt
      - name: Browser and printable contract review
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/check-employment-ui.cjs
          for name in paper electronic; do
            pdftotext -layout "employment-review-output/$name-contract.pdf" "employment-review-output/$name-contract.txt"
            pdftoppm -r 85 -png "employment-review-output/$name-contract.pdf" "employment-review-output/$name-page"
          done
          python3 - <<'PY'
          from pathlib import Path
          for name in ['paper','electronic']:
              text=Path(f'employment-review-output/{name}-contract.txt').read_text()
              for required in ['第1条','第11条','2,000','2026-10-17','2027-03-31','麦倉優輔','講師 甲','扶養控除']:
                  assert required in text, (name,required)
              pages=[p for p in text.split('\f') if p.strip()]
              assert 2<=len(pages)<=6, (name,len(pages))
              assert all(len(p.strip())>100 for p in pages), 'unexpected blank/trailing page'
              print(name, len(pages), 'pages, required text verified')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: employment-review
          path: employment-review-output/
          retention-days: 30
      - name: Preserve synthetic review copies on this branch
        if: success()
        run: |
          mkdir -p docs/staff-onboarding-preview-20261017
          cp employment-review-output/* docs/staff-onboarding-preview-20261017/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/staff-onboarding-preview-20261017
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Keep synthetic employment review copies (unpublished)"
          git push origin HEAD:codex/staff-onboarding-flow-20261017
