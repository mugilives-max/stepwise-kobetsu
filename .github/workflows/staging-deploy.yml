name: Staging deploy
# 検証環境（https://stepwise-staging.stepwise-edu.workers.dev）へ出す。本番（stepwise-api・stepwise-v2・stepwise-files）には触れない。
# - main に入ったら自動で出す（中のデータはそのまま。初めてのときだけ架空のデータを入れる）
# - 手で動かすとき（Run workflow）: 出すブランチと、出したあと最初の状態に戻すかを選べる（本番に出す前に、ブランチを試すとき）
on:
  push:
    branches: [main]
    paths: ['cf/v2/**', 'cf/migrations-v2/**', 'cf/staging/**', 'staff/**', 'family/**', 'student/**', 'assets/**', 'terms/**', 'scripts/demo-seed.mjs', 'scripts/build-staging.mjs', 'scripts/staging-reset.mjs', 'test/helpers/**', '.github/workflows/staging-deploy.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: '検証環境に出すブランチ'
        required: false
        default: 'main'
      reset:
        description: '出したあと、最初の状態（架空のデータ）に戻す'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: stepwise-staging
  cancel-in-progress: false
jobs:
  deploy:
    # 自動で出すのは、GitHub の鍵（CLOUDFLARE_API_TOKEN）で検証環境の Worker を出せるようにしてから（リポジトリの変数 STAGING_AUTO_DEPLOY = true）。
    # それまでは手元の `npm run staging:deploy`（本人の Cloudflare のログインで出す）を使う
    if: github.repository == 'mugilives-max/stepwise-kobetsu' && (github.event_name == 'workflow_dispatch' || vars.STAGING_AUTO_DEPLOY == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: npm ci
      - name: Make sure the staging config never points at production
        run: |
          ! grep -E '91ea045c-94a4-413f-91c1-1e29ebe6eb24|889ff9cf-4bb0-4ef9-ba0e-b4ce2105f039|"stepwise-files"|"stepwise-api"|GAS_URL|crons' cf/staging/wrangler.jsonc
      - name: Build staging pages and the first-state snapshot
        run: node scripts/build-staging.mjs
      - name: Apply migrations to the staging database and publish the staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx wrangler d1 migrations apply DB2 --remote --config cf/staging/wrangler.jsonc
          # wrangler deploy はアカウント全体の workers.dev の設定を読みに行き、この鍵では断られるため、版を上げてから切り替える
          # （workers.dev の住所は最初の公開のときに有効にしてある）
          npx wrangler versions upload --config cf/staging/wrangler.jsonc --message "staging ${GITHUB_SHA::7}" | tee upload.log
          vid=$(grep -oE 'Worker Version ID: [0-9a-f-]{36}' upload.log | awk '{print $4}')
          test -n "$vid"
          npx wrangler versions deploy "$vid@100%" --config cf/staging/wrangler.jsonc --yes
      - name: Fill with fake data (first time, or when asked)
        run: node scripts/staging-reset.mjs https://stepwise-staging.stepwise-edu.workers.dev ${{ inputs.reset && '--force' || '--if-empty' }}
