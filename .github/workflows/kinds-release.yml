name: Lesson kinds production release
on:
  push:
    branches: ['claude/kinds-release-20261026']
    paths: ['scripts/kinds-release-request.json', 'scripts/release-kinds.mjs', '.github/workflows/kinds-release.yml']
permissions:
  contents: read
concurrency:
  group: stepwise-production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mugilives-max/stepwise-kobetsu'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: release-control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 20bb59fe39f91107e4a6786e14221d98f3baba2f
          path: release-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0be249d0c02e457722c12066dd7c5e3939ce80ea
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: npm ci
        working-directory: release-source
      - run: npm ci
        working-directory: baseline
      - name: Check pinned release
        run: |
          node --check release-control/scripts/release-kinds.mjs
      - name: Preserve records and perform explicitly requested operation
        env:
          GH_READ_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: node release-control/scripts/release-kinds.mjs
