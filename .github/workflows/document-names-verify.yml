name: Verify document names publication
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed verification commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: stepwise-production-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'mugilives-max/stepwise-kobetsu'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: verification-source
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a65bbcdac4dfde320497b308af7948d4acf86191
          path: release-source
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: npm ci
        working-directory: release-source
      - name: Check verification script
        run: node --check verification-source/scripts/verify-document-names.mjs
      - name: Verify existing publication without deploying or migrating
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: node verification-source/scripts/verify-document-names.mjs
