name: Staff self-registration checks
on:
  workflow_dispatch:
  push:
    branches: ['codex/staff-self-registration-20261017', 'claude/staff-onboarding-stages-20261017', 'claude/staff-other-employment-20261017', 'claude/preview-seed-employee-20261017', 'claude/staff-registration-form-20261017', 'claude/staff-pending-page-20261017', 'claude/staff-owner-review-20261017', 'claude/staff-hide-stopped-20261017', 'claude/staff-cleanup-pages-20261017', 'claude/employment-conditions-split-20261017', 'claude/owner-stages-20261018', 'claude/staff-docs-samples-20261018', 'claude/payslip-layout-20261018', 'claude/terms-page-20261018', 'claude/employment-period-20261018', 'claude/contract-shift-insurance-20261018', 'claude/staff-rules-20261018', 'claude/staff-rules-document-20261018', 'claude/contract-online-scope-20261018', 'claude/staff-manual-rename-20261018', 'claude/doc-issuer-lines-20261018', 'claude/docs-a4-viewport-20261018']
    paths: ['cf/**','staff/**','test/**','scripts/check-staff-registration-ui.cjs','.github/workflows/staff-registration-checks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: npm ci
      - name: Syntax and focused regressions
        run: |
          npm run check
          node --check cf/v2/staff-bank.mjs
          node --check cf/v2/staff-registration.mjs
          node --check cf/v2/employment.mjs
          node --check --input-type=module < staff/bank.js
          node --check --input-type=module < staff/employment.js
          node --check --input-type=module < staff/app.js
          node --test test/v2-staff-registration.test.cjs test/v2-staff-rules.test.cjs test/v2-staff-bank.test.cjs test/v2-employment.test.cjs test/v2-employment-email.test.cjs test/v2-payroll.test.cjs test/v2-accounts.test.cjs test/v2-backup.test.cjs test/v2-contract-history.test.cjs
      - name: Synthetic employee and owner browser flow
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/check-staff-registration-ui.cjs
          node scripts/check-staff-bank-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staff-registration-review
          path: staff-registration-review-output/
          retention-days: 14
