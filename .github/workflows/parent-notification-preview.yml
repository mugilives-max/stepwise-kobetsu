name: Parent notification review (no deployment)
on:
  push:
    branches: ['codex/parent-notification-audit-20261016']
    paths: ['cf/v2/**','cf/migrations-v2/**','gas-effects/**','assets/v2/**','family/**','staff/**','test/**','scripts/check-parent-notifications.cjs','.github/workflows/parent-notification-preview.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Syntax
        run: |
          npm run check
          for f in cf/v2/*.mjs; do node --check "$f"; done
          for f in staff/*.js family/*.js assets/v2/*.js; do node --check --input-type=module < "$f"; done
          node --check < gas-effects/Code.gs
      - name: Regression tests with isolated databases
        run: node --test test/v2-*.test.cjs
      - name: Additive migration in isolated runner
        run: npx wrangler d1 migrations apply DB2 --config cf/wrangler.jsonc --env local --local --persist-to /tmp/stepwise-notices-d1
      - name: Browser checks with synthetic data
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/check-contract-ui.cjs
          if test -f scripts/check-parent-notifications.cjs; then node scripts/check-parent-notifications.cjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parent-notification-review
          path: |
            parent-notification-output/
            contract-ui-output/
          retention-days: 30
