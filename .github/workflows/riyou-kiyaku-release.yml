name: Riyou kiyaku production release
on:
  push:
    branches: ['claude/riyou-kiyaku-release-20261025']
    paths: ['scripts/riyou-kiyaku-release-request.json', 'scripts/release-riyou-kiyaku.mjs', '.github/workflows/riyou-kiyaku-release.yml']
permissions:
  contents: read
concurrency:
  group: stepwise-production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mugilives-max/stepwise-kobetsu'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: release-control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a1b79b6e742545af8894cffc926e0bbbdbbf0593
          path: release-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ae0f3193a68172cc2c9a9335de8f4825893db8d9
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: npm ci
        working-directory: release-source
      - run: npm ci
        working-directory: baseline
      - name: Check pinned release
        run: |
          node --check release-control/scripts/release-riyou-kiyaku.mjs
      - name: Preserve records and perform explicitly requested operation
        env:
          GH_READ_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: node release-control/scripts/release-riyou-kiyaku.mjs
