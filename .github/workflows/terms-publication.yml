name: Verify published terms files
on:
  push:
    branches: ["codex/terms-publication-live-check-20261012"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compare deployed Web and PDF bytes with the repository
        run: |
          python3 - <<'PY'
          import hashlib, json, time, urllib.request
          from pathlib import Path
          base = "https://www.stepwise-education.jp/"
          files = {
            "": "index.html",
            "terms/": "terms/index.html",
            "terms/2026-11-20261012/": "terms/2026-11-20261012/index.html",
            "terms/2026-11-20261012/stepwise-terms-2026-11-20261012.pdf": "terms/2026-11-20261012/stepwise-terms-2026-11-20261012.pdf",
            "terms/2026-11/": "terms/2026-11/index.html",
            "terms/2026-11/stepwise-terms-2026-11.pdf": "terms/2026-11/stepwise-terms-2026-11.pdf",
          }
          results = []
          for route, path in files.items():
              expected = Path(path).read_bytes()
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(base + route, headers={"User-Agent":"Stepwise-publication-verification","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          data = response.read()
                          status, content_type = response.status, response.headers.get("Content-Type")
                      assert status == 200
                      assert data == expected, "Content mismatch: " + route
                      if path.endswith(".pdf"):
                          assert data.startswith(b"%PDF-")
                          assert "application/pdf" in content_type
                      results.append({"url":base+route,"status":status,"content_type":content_type,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"repository_match":True})
                      break
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(15)
          print(json.dumps({"checked_files":len(results),"all_match":True,"results":results}, ensure_ascii=False, indent=2))
          PY
