name: Over plan confirm release
on:
  push:
    branches: ['claude/over-plan-release-20261027']
    paths: ['scripts/over-plan-release-request.json', 'scripts/release-over-plan.mjs', '.github/workflows/over-plan-release.yml']
permissions:
  contents: read
concurrency:
  group: stepwise-production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mugilives-max/stepwise-kobetsu'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: release-control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4c2235ae0d224f21d27dc99c1e5457d06da62d34
          path: release-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5e7273c05e187f0393b2ae6a2492e76edea50c81
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: npm ci
        working-directory: release-source
      - run: npm ci
        working-directory: baseline
      - name: Check pinned release
        run: |
          node --check release-control/scripts/release-over-plan.mjs
      - name: Preserve records and perform explicitly requested operation
        env:
          GH_READ_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: node release-control/scripts/release-over-plan.mjs
