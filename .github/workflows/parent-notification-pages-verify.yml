name: Verify parent notification Pages publication
on:
  push:
    branches: ['codex/parent-notification-release-20261016']
    paths: ['scripts/verify-parent-notification-pages.mjs', '.github/workflows/parent-notification-pages-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: release-control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 71ba752ce0a0516c299a51fd2956070b10ac8228
          path: release-source
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Verify public assets and Worker health without production writes
        run: node release-control/scripts/verify-parent-notification-pages.mjs
      - run: npm ci
        working-directory: release-source
      - name: Count existing notices from the verified private backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: node release-control/scripts/check-parent-notification-release-counts.mjs
