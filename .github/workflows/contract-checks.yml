name: Contract history checks
on:
  pull_request:
    paths: ['scripts/check-contract-ui.cjs', 'scripts/check-enrollment-ui.cjs', 'cf/v2/**', 'cf/migrations-v2/**', 'assets/v2/**', 'family/**', 'staff/**', 'test/v2-*', '.github/workflows/contract-checks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Syntax
        run: |
          npm run check
          for f in cf/v2/*.mjs; do node --check "$f"; done
          for f in staff/*.js family/*.js assets/v2/*.js; do node --check --input-type=module < "$f"; done
      - name: V2 regression tests
        run: node --test test/v2-*.test.cjs
      - name: D1 migration check on isolated GitHub runner
        run: npx wrangler d1 migrations apply DB2 --config cf/wrangler.jsonc --env local --local --persist-to /tmp/stepwise-contract-d1
      - name: Browser checks with synthetic data
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/check-contract-ui.cjs
          node scripts/check-enrollment-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-ui-checks
          path: |
            contract-ui-output/
            enrollment-ui-output/
          retention-days: 14
